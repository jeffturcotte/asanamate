version: 2
project_name: asanamate

before:
  hooks:
    - go mod tidy
    - go test ./...

# Each archive holds all three binaries.
builds:
  - id: asanamate
    main: ./cmd/asanamate
    binary: asanamate
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}
  - id: asanamate-hrvst
    main: ./cmd/asanamate-hrvst
    binary: asanamate-hrvst
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
  # The ccmux agent adapter ships in the same archive.
  - id: asanamate-ccmux
    main: ./cmd/asanamate-ccmux
    binary: asanamate-ccmux
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
  # The Hub project links provider ships in the same archive.
  - id: asanamate-hub
    main: ./cmd/asanamate-hub
    binary: asanamate-hub
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github

# The tap repository does not exist yet; the cask is built but not published.
# Remove skip_upload once sadmachine/homebrew-tap and HOMEBREW_TAP_TOKEN exist.
homebrew_casks:
  - name: asanamate
    skip_upload: true
    repository:
      owner: sadmachine
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/sadmachine/asanamate
    description: Terminal UI for Asana tickets with scriptable actions
    binaries: [asanamate, asanamate-hrvst, asanamate-ccmux, asanamate-hub]
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/asanamate", "#{staged_path}/asanamate-hrvst", "#{staged_path}/asanamate-ccmux", "#{staged_path}/asanamate-hub"]
          end
