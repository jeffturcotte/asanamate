name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The tag's docs/migrations.md section, if any, heads the release notes.
      - name: Upgrade notes
        id: notes
        run: |
          awk -v tag="## $GITHUB_REF_NAME" '$0 == tag { on = 1; next } on && /^## / { exit } on' docs/migrations.md > "$RUNNER_TEMP/notes.md"
          if grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            { echo '## Upgrading'; cat "$RUNNER_TEMP/notes.md"; } > "$RUNNER_TEMP/header.md"
            echo "flags=--release-header=$RUNNER_TEMP/header.md" >> "$GITHUB_OUTPUT"
          fi
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean ${{ steps.notes.outputs.flags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
