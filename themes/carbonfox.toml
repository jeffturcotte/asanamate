# Carbonfox palette adapted to asanamate's themed roles.
# Palette reference: https://github.com/EdenEast/nightfox.nvim/blob/4dacd3f0185a2227bdf3b6c0975a8f0bf87cac9a/lua/nightfox/palette/carbonfox.lua
# Copyright (c) 2021 James Simpson. MIT license: LICENSE.nightfox.
base = "dark"

[colors]
accent = { fg = "#78a9ff", bold = true }
border = "#535353"
muted = { fg = "#6e6f70", faint = false }
highlight = { fg = "#f2f4f8", bg = "#525253", reverse = false }
ok = "#25be6a"
warn = "#be95ff"
error = "#ee5396"
working = "#33b1ff"
pinned = { fg = "#3ddbd9", bold = true }
viewing = { fg = "#ff7eb6", bold = true }
reacted = { fg = "#f2f4f8", bg = "#525253" }
new = { fg = "#161616", bg = "#78a9ff", bold = true }
more = { fg = "#161616", bg = "#3ddbd9", bold = true }
authors = ["#78a9ff", "#ff7eb6", "#33b1ff", "#25be6a", "#be95ff", "#ee5396"]

[colors.mode]
normal = { fg = "#161616", bg = "#78a9ff", bold = true }
filter = { fg = "#161616", bg = "#be95ff", bold = true }
read = { fg = "#161616", bg = "#33b1ff", bold = true }
edit = { fg = "#161616", bg = "#ff7eb6", bold = true }

[colors.markdown]
text = "#f2f4f8"
heading = { fg = "#78a9ff", bold = true }
h1 = { fg = "#161616", bg = "#78a9ff", bold = true }
link = { fg = "#33b1ff", underline = true }
code = { fg = "#25be6a", bg = "#0c0c0c" }
code_block = { fg = "#f2f4f8", bg = "#0c0c0c" }
quote = { fg = "#6e6f70", italic = true }
rule = "#535353"
