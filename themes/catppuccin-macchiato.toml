# Catppuccin Macchiato palette adapted to asanamate's themed roles.
# Palette reference: https://github.com/catppuccin/palette/blob/07d02aa110ef9eb7e7427afca5c73ba9cf7f8ebd/palette.json
# Copyright (c) 2021 Catppuccin. MIT license: LICENSE.catppuccin.
base = "dark"

[colors]
accent = { fg = "#8aadf4", bold = true }
border = "#5b6078"
muted = { fg = "#a5adcb", faint = false }
highlight = { fg = "#cad3f5", bg = "#363a4f", reverse = false }
ok = "#a6da95"
warn = "#eed49f"
error = "#ed8796"
working = "#8bd5ca"
pinned = { fg = "#f5a97f", bold = true }
viewing = { fg = "#c6a0f6", bold = true }
reacted = { fg = "#cad3f5", bg = "#363a4f" }
new = { fg = "#24273a", bg = "#8aadf4", bold = true }
more = { fg = "#24273a", bg = "#f5a97f", bold = true }
authors = ["#8aadf4", "#c6a0f6", "#8bd5ca", "#a6da95", "#eed49f", "#ed8796"]

[colors.mode]
normal = { fg = "#24273a", bg = "#8aadf4", bold = true }
filter = { fg = "#24273a", bg = "#eed49f", bold = true }
read = { fg = "#24273a", bg = "#8bd5ca", bold = true }
edit = { fg = "#24273a", bg = "#c6a0f6", bold = true }

[colors.markdown]
text = "#cad3f5"
heading = { fg = "#8aadf4", bold = true }
h1 = { fg = "#24273a", bg = "#8aadf4", bold = true }
link = { fg = "#8bd5ca", underline = true }
code = { fg = "#a6da95", bg = "#1e2030" }
code_block = { fg = "#cad3f5", bg = "#1e2030" }
quote = { fg = "#a5adcb", italic = true }
rule = "#5b6078"
