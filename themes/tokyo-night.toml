# Tokyo Night palette adapted to asanamate's themed roles.
# Palette reference: https://github.com/folke/tokyonight.nvim
base = "dark"

[colors]
accent = { fg = "#7aa2f7", bold = true }
border = "#565f89"
muted = { fg = "#787c99", faint = false }
highlight = { fg = "#c0caf5", bg = "#283457", reverse = false }
ok = "#9ece6a"
warn = "#e0af68"
error = "#f7768e"
working = "#7dcfff"
pinned = { fg = "#ff9e64", bold = true }
viewing = { fg = "#bb9af7", bold = true }
reacted = { fg = "#c0caf5", bg = "#283457" }
new = { fg = "#1a1b26", bg = "#7aa2f7", bold = true }
more = { fg = "#1a1b26", bg = "#ff9e64", bold = true }
authors = ["#7aa2f7", "#bb9af7", "#7dcfff", "#9ece6a", "#e0af68", "#f7768e"]

[colors.mode]
normal = { fg = "#1a1b26", bg = "#7aa2f7", bold = true }
filter = { fg = "#1a1b26", bg = "#e0af68", bold = true }
read = { fg = "#1a1b26", bg = "#7dcfff", bold = true }
edit = { fg = "#1a1b26", bg = "#bb9af7", bold = true }

[colors.markdown]
text = "#c0caf5"
heading = { fg = "#7aa2f7", bold = true }
h1 = { fg = "#1a1b26", bg = "#7aa2f7", bold = true }
link = { fg = "#7dcfff", underline = true }
code = { fg = "#9ece6a", bg = "#16161e" }
code_block = { fg = "#c0caf5", bg = "#16161e" }
quote = { fg = "#787c99", italic = true }
rule = "#565f89"
