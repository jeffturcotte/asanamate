# Sonokai Atlantis palette adapted to asanamate's themed roles.
# Palette reference: https://github.com/sainnhe/sonokai/blob/b023c5280b16fe2366f5e779d8d2756b3e5ee9c3/autoload/sonokai.vim
# Copyright (c) 2020 sainnhe. MIT license: LICENSE.sonokai.
base = "dark"

[colors]
accent = { fg = "#72cce8", bold = true }
border = "#5a6477"
muted = { fg = "#828a9a", faint = false }
highlight = { fg = "#e1e3e4", bg = "#424b5b", reverse = false }
ok = "#9dd274"
warn = "#eacb64"
error = "#ff6578"
working = "#7ad5f1"
pinned = { fg = "#f69c5e", bold = true }
viewing = { fg = "#ba9cf3", bold = true }
reacted = { fg = "#e1e3e4", bg = "#424b5b" }
new = { fg = "#2a2f38", bg = "#ff6578", bold = true }
more = { fg = "#2a2f38", bg = "#7ad5f1", bold = true }
authors = ["#72cce8", "#ba9cf3", "#7ad5f1", "#9dd274", "#eacb64", "#ff6578"]

[colors.mode]
normal = { fg = "#2a2f38", bg = "#72cce8", bold = true }
filter = { fg = "#2a2f38", bg = "#eacb64", bold = true }
read = { fg = "#2a2f38", bg = "#7ad5f1", bold = true }
edit = { fg = "#2a2f38", bg = "#ba9cf3", bold = true }

[colors.markdown]
text = "#e1e3e4"
heading = { fg = "#72cce8", bold = true }
h1 = { fg = "#2a2f38", bg = "#72cce8", bold = true }
link = { fg = "#7ad5f1", underline = true }
code = { fg = "#9dd274", bg = "#333846" }
code_block = { fg = "#e1e3e4", bg = "#333846" }
quote = { fg = "#828a9a", italic = true }
rule = "#5a6477"
