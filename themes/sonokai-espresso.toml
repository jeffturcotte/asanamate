# Sonokai Espresso palette adapted to asanamate's themed roles.
# Palette reference: https://github.com/sainnhe/sonokai/blob/b023c5280b16fe2366f5e779d8d2756b3e5ee9c3/autoload/sonokai.vim
# Copyright (c) 2020 sainnhe. MIT license: LICENSE.sonokai.
base = "dark"

[colors]
accent = { fg = "#81d0c9", bold = true }
border = "#6a5e59"
muted = { fg = "#90817b", faint = false }
highlight = { fg = "#e4e3e1", bg = "#4e433f", reverse = false }
ok = "#a6cd77"
warn = "#f0c66f"
error = "#f86882"
working = "#85dad2"
pinned = { fg = "#f08d71", bold = true }
viewing = { fg = "#9fa0e1", bold = true }
reacted = { fg = "#e4e3e1", bg = "#4e433f" }
new = { fg = "#312c2b", bg = "#f86882", bold = true }
more = { fg = "#312c2b", bg = "#85dad2", bold = true }
authors = ["#81d0c9", "#9fa0e1", "#85dad2", "#a6cd77", "#f0c66f", "#f86882"]

[colors.mode]
normal = { fg = "#312c2b", bg = "#81d0c9", bold = true }
filter = { fg = "#312c2b", bg = "#f0c66f", bold = true }
read = { fg = "#312c2b", bg = "#85dad2", bold = true }
edit = { fg = "#312c2b", bg = "#9fa0e1", bold = true }

[colors.markdown]
text = "#e4e3e1"
heading = { fg = "#81d0c9", bold = true }
h1 = { fg = "#312c2b", bg = "#81d0c9", bold = true }
link = { fg = "#85dad2", underline = true }
code = { fg = "#a6cd77", bg = "#393230" }
code_block = { fg = "#e4e3e1", bg = "#393230" }
quote = { fg = "#90817b", italic = true }
rule = "#6a5e59"
