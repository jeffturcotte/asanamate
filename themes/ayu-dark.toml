# Ayu Dark palette adapted to asanamate's themed roles.
# Palette reference: https://unpkg.com/ayu@9.1.0/dist/generated/dark.js
# Copyright (c) Konstantin Pschera. MIT license: LICENSE.ayu.
base = "dark"

[colors]
accent = { fg = "#59c2ff", bold = true }
border = "#4d5763"
muted = { fg = "#5a6673", faint = false }
highlight = { fg = "#bfbdb6", bg = "#193155", reverse = false }
ok = "#aad94c"
warn = "#ffb454"
error = "#f07178"
working = "#95e6cb"
pinned = { fg = "#ff8f40", bold = true }
viewing = { fg = "#d2a6ff", bold = true }
reacted = { fg = "#bfbdb6", bg = "#193155" }
new = { fg = "#10141c", bg = "#59c2ff", bold = true }
more = { fg = "#10141c", bg = "#ff8f40", bold = true }
authors = ["#59c2ff", "#d2a6ff", "#95e6cb", "#aad94c", "#ffb454", "#f07178"]

[colors.mode]
normal = { fg = "#10141c", bg = "#59c2ff", bold = true }
filter = { fg = "#10141c", bg = "#ffb454", bold = true }
read = { fg = "#10141c", bg = "#95e6cb", bold = true }
edit = { fg = "#10141c", bg = "#d2a6ff", bold = true }

[colors.markdown]
text = "#bfbdb6"
heading = { fg = "#59c2ff", bold = true }
h1 = { fg = "#10141c", bg = "#59c2ff", bold = true }
link = { fg = "#95e6cb", underline = true }
code = { fg = "#aad94c", bg = "#0d1017" }
code_block = { fg = "#bfbdb6", bg = "#0d1017" }
quote = { fg = "#5a6673", italic = true }
rule = "#4d5763"
